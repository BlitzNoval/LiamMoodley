name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v5-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v5-portfolio/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ./v5-portfolio/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('v5-portfolio/package-lock.json') }}-${{ hashFiles('v5-portfolio/**/*.ts', 'v5-portfolio/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('v5-portfolio/package-lock.json') }}-

      - name: Install dependencies
        run: npm install

      - name: Build Next.js (static export)
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./v5-portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
