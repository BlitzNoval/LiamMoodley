name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v4-main/v4-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'yarn'
          cache-dependency-path: v4-main/v4-main/yarn.lock

      - name: Cache Gatsby build
        uses: actions/cache@v4
        with:
          path: |
            ./v4-main/v4-main/.cache
            ./v4-main/v4-main/public
          key: gatsby-${{ runner.os }}-${{ hashFiles('v4-main/v4-main/yarn.lock') }}
          restore-keys: |
            gatsby-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build with Gatsby
        run: npx gatsby build --prefix-paths
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          GATSBY_CPU_COUNT: '2'

      - name: Disable Jekyll
        run: touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./v4-main/v4-main/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
